version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-recommender-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - movie-recommender-network

  nginx:
    image: nginx:latest
    container_name: movie-recommender-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - movie-recommender-network

networks:
  movie-recommender-network:
    driver: bridge